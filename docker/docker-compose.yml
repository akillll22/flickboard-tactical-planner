version: '3.8'

services:
  # MySQL 8.0 Relational Database
  mysql:
    image: mysql:8.0
    container_name: barca_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_flick
      MYSQL_DATABASE: barca_tactical_db
      MYSQL_USER: barca_user
      MYSQL_PASSWORD: barca_secret_2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    networks:
      - barca_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel 11 Backend API Gateway & Data Broker
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/laravel.Dockerfile
    container_name: barca_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Barca Tactical Planner API"
      APP_ENV: local
      APP_KEY: base64:SomeGeneratedRandomAppKeyHereForFlickboard==
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: barca_tactical_db
      DB_USERNAME: barca_user
      DB_PASSWORD: barca_secret_2026
      FASTAPI_AI_URL: "http://ai_engine:8080"
    volumes:
      - ../backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - barca_net

  # Python FastAPI ML Inference Engine (Explainable AI & Naive Bayes)
  ai_engine:
    build:
      context: ../ai_engine
      dockerfile: ../docker/fastapi.Dockerfile
    container_name: barca_ai_engine
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MODEL_PATH: "/app/models"
      ENV: "production"
    volumes:
      - ../ai_engine:/app
    networks:
      - barca_net

networks:
  barca_net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
